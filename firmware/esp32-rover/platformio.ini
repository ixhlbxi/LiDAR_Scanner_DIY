; PlatformIO project — Rover ESP32 firmware
;
; Two firmware modes selectable via build flag:
;
;   pio run -e lora_rtcm_relay -t upload   ; default — LoRa RTCM Rx + STATUS/LINK Tx (DEC-031 fallback)
;   pio run -e ntrip_client    -t upload   ; NTRIP over WiFi (DEC-032 alternate; preserves DEC-006 "Pi out of correction path")
;
; Both modes write RTCM to F9P UART2 and emit STATUS (0x01) / LINK (0x02) LoRa
; frames (v2 envelope; see ../../docs/BASE_STATION_INTEGRATION.md §4).
;
; Hardware target: Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262 + WiFi).
; Compatible with bare ESP32 + SX1262 breakouts as long as the LoRa pin map in
; src/main.cpp is updated.
;
; Before flashing:
;     cp include/config.h.example include/config.h
;     # edit include/config.h — WIFI_SSID, WIFI_PASSWORD (ntrip_client mode only),
;     #                         NTRIP_PASSWORD, NTRIP_HOST/PORT/MOUNTPOINT/USERNAME

[platformio]
default_envs = lora_rtcm_relay

[env]
platform = espressif32
framework = arduino
board = heltec_wifi_lora_32_V3
monitor_speed = 115200
upload_speed = 921600

; -- LoRa hardware (matches Heltec V3 on-board SX1262, same as
;    arm-drone-lidar-workflow/base-station/heltec-display/) --
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D LORA_FREQ_MHZ=915.0
    -D LORA_BW_KHZ=125.0
    -D LORA_SF=7
    -D LORA_CR_DENOM=5
    -D LORA_SYNC_PRIVATE=0x12
    -D LORA_TX_POWER_DBM=14
    -D LORA_TCXO_VOLTAGE=1.8
    -D F9P_UART2_BAUD=115200
    -D PI_USB_BAUD=115200

lib_deps =
    jgromes/RadioLib@^6.6.0
    bblanchon/ArduinoJson@^7.0.4

; -- Mode A — LoRa RTCM relay (default; matches v0.9.2 DEC-006 robustness) --
[env:lora_rtcm_relay]
build_flags =
    ${env.build_flags}
    -D ROVER_MODE_LORA_RTCM_RELAY=1

; -- Mode B — NTRIP-over-WiFi client (DEC-032) --
[env:ntrip_client]
build_flags =
    ${env.build_flags}
    -D ROVER_MODE_NTRIP_CLIENT=1
